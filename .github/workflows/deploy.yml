name: Deploy versioned docs

# Thin caller. All the logic lives in deploy-impl.yml on main, so the pipeline
# is fixed in one place instead of once per snapshot branch. Only the triggers
# have to live here, because Actions always reads them from the pushed ref.

on:
  push:
    branches: [main, "docs/v*"]
  workflow_dispatch:
    inputs:
      promote:
        description: "Version to promote to stable/latest and serve at / (e.g. v1.2.1). Leave empty to redeploy this ref instead."
        required: false
        default: ""

permissions:
  # mike pushes to gh-pages - needs write to repo contents.
  contents: write

# Don't cancel in-progress deploys; mike fetches gh-pages, mutates it, pushes
# back. Cancellation mid-flight could leave gh-pages in a weird state.
concurrency:
  group: mike-deploy
  cancel-in-progress: false

jobs:
  run:
    uses: librescoot/unu-tech-reference/.github/workflows/deploy-impl.yml@main
    with:
      promote: ${{ inputs.promote || '' }}
    permissions:
      contents: write
